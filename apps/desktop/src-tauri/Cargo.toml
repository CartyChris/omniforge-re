[package]
name = "omniforge-re"
version = "1.1.0"
description = "OmniForge RE — universal reverse engineering & AI development studio"
authors = ["OmniForge"]
edition = "2021"
rust-version = "1.77"
license = "UNLICENSED"
publish = false

[lib]
name = "omniforge_re_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# enabled by `tauri build`: serve the embedded UI instead of the dev server
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
rand = "0.8"

# macOS Keychain for API keys / tokens (other platforms get a clear "unsupported" error)
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
