<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="OmniForge RE — analyse, reverse-engineer, rebuild and ship software with AI. Websites, repositories, packages and binaries." />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OmniForge RE</title>
    <script>
      // apply the saved theme before first paint (no flash)
      try { var t = localStorage.getItem("omniforge.theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
