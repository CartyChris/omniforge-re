name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit + integration tests (core, server)
        run: pnpm test
      - name: Install Chromium for the browser tests
        run: pnpm --filter @omniforge/web exec playwright install --with-deps chromium
      - name: Cargo check (desktop shell)
        run: |
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          curl -fsSL https://bun.sh/install | bash && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          pnpm --filter @omniforge/desktop sidecar -- --host
          node apps/desktop/scripts/smoke-engine.mjs apps/desktop/src-tauri/binaries/omniforge-bridge-x86_64-unknown-linux-gnu
          cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: End-to-end (production build, fixture site, scripted model, real engine)
        run: pnpm --filter @omniforge/web e2e
        env: { CI: "true" }
      - name: Supply chain (dependency licences + forbidden code in the production bundle)
        run: |
          test -d apps/web/dist || pnpm --filter @omniforge/web exec vite build
          node scripts/check-bundle.mjs apps/web/dist
          node scripts/license-audit.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
