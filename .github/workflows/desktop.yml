name: Desktop (macOS)
# Builds the real .app and .dmg for Apple Silicon (primary) and Intel, then VERIFIES them before anything is published:
# architecture, bundled engine + resources, signature state, DMG contents, and a launch smoke test of the engine.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["apps/desktop/**", "packages/server/**", "apps/web/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "packages/server/**", "apps/web/**", ".github/workflows/desktop.yml"]
permissions: { contents: write }
concurrency:
  group: "desktop-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, arch: arm64, label: apple-silicon }
          - { target: x86_64-apple-darwin, arch: x86_64, label: intel }
    runs-on: macos-latest   # Apple Silicon runner; the Intel app is cross-compiled
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "apps/desktop/src-tauri -> target", key: "${{ matrix.target }}" }
      - run: pnpm install --frozen-lockfile

      # Unset repository secrets expand to EMPTY strings, and Tauri treats a defined-but-empty APPLE_CERTIFICATE as "sign with this" and fails.
      # So the signing variables are exported only when the secrets really exist; otherwise the app is ad-hoc signed (signingIdentity "-").
      - name: Configure code signing (only when the Apple secrets exist)
        shell: bash
        env:
          APPLE_CERTIFICATE_IN: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_IN: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_IN: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_IN: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_IN: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_IN: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_IN" ] && [ -n "$APPLE_SIGNING_IDENTITY_IN" ]; then
            { echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE_IN"; echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_IN"; echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_IN"; } >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID_IN" ] && [ -n "$APPLE_PASSWORD_IN" ] && [ -n "$APPLE_TEAM_ID_IN" ]; then { echo "APPLE_ID=$APPLE_ID_IN"; echo "APPLE_PASSWORD=$APPLE_PASSWORD_IN"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_IN"; } >> "$GITHUB_ENV"; echo "signing + notarisation enabled"; else echo "signing enabled (no notarisation credentials)"; fi
          else echo "no Apple signing secrets: building ad-hoc signed (unsigned for Gatekeeper)"; fi

      - name: Compile the local engine for ${{ matrix.target }}
        run: pnpm --filter @omniforge/desktop sidecar -- --target ${{ matrix.target }}

      - name: Build the app (.app + .dmg)
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @omniforge/desktop exec tauri build --target ${{ matrix.target }} --bundles app,dmg 2>&1 | tee build.log

      - name: Surface the build errors as annotations (readable without log access)
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re, os
          def esc(s): return s.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          try: t = open('build.log', errors='replace').read()
          except FileNotFoundError: t = ''
          t = re.sub(r'\x1b\[[0-9;]*m', '', t)
          lines = t.splitlines()
          hits = [l for l in lines if re.search(r'error(\[|:)|panicked|failed|Error:|cannot find|unresolved|No such file|not found', l, re.I)]
          if hits: print('::error title=build errors (matching lines)::' + esc('\n'.join(hits[:40])[:3500]))
          tail = '\n'.join(lines[-70:])
          for i in range(0, min(len(tail), 9000), 3000): print('::error title=build log tail %d::%s' % (i // 3000 + 1, esc(tail[i:i + 3000])))
          PY

      - name: Verify the bundle
        shell: bash
        run: |
          set -euo pipefail
          B=apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle
          APP="$B/macos/OmniForge RE.app"
          DMG=$(ls "$B"/dmg/*.dmg | head -1)
          test -d "$APP" || { echo "::error::no .app produced"; exit 1; }
          echo "--- architecture"; lipo -info "$APP/Contents/MacOS/omniforge-re"; lipo -info "$APP/Contents/MacOS/omniforge-bridge"
          lipo -info "$APP/Contents/MacOS/omniforge-re" | grep -q "${{ matrix.arch }}" || { echo "::error::main binary is not ${{ matrix.arch }}"; exit 1; }
          lipo -info "$APP/Contents/MacOS/omniforge-bridge" | grep -q "${{ matrix.arch }}" || { echo "::error::engine is not ${{ matrix.arch }}"; exit 1; }
          echo "--- resources"; test -f "$APP/Contents/Resources/playwright-core/index.mjs" || { echo "::error::playwright-core resource missing"; exit 1; }
          test -f "$APP/Contents/Resources/tree-sitter/web-tree-sitter.wasm" && test -f "$APP/Contents/Resources/tree-sitter/tree-sitter-python.wasm" || { echo "::error::tree-sitter grammars resource missing"; exit 1; }
          test -f "$APP/Contents/Resources/icon.icns" || { echo "::error::icon missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist" | grep -qx "com.omniforge.re"
          /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          echo "--- signature (informational: ad-hoc when no Apple secrets)"; codesign -dv --verbose=2 "$APP" 2>&1 | head -12 || true
          codesign --verify --deep --strict "$APP" && echo "signature verifies" || echo "::warning::signature does not verify (expected only for unsigned builds)"
          echo "--- dmg"; hdiutil verify "$DMG"
          MNT=$(mktemp -d); hdiutil attach "$DMG" -mountpoint "$MNT" -nobrowse -quiet
          test -d "$MNT/OmniForge RE.app" || { echo "::error::DMG does not contain the app"; hdiutil detach "$MNT" -quiet; exit 1; }
          hdiutil detach "$MNT" -quiet
          echo "APP=$APP" >> "$GITHUB_ENV"; echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Launch smoke test (the real app starts its engine and the engine answers)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          LOG="$HOME/Library/Logs/com.omniforge.re/engine.log"; rm -f "$LOG"
          "$APP/Contents/MacOS/omniforge-re" > app.out 2>&1 &
          PID=$!
          for i in $(seq 1 60); do grep -q "engine ready on" "$LOG" 2>/dev/null && break; sleep 1; done
          cat "$LOG" || true
          URL=$(grep -o 'http://127.0.0.1:[0-9]*' "$LOG" | head -1)
          test -n "$URL" || { echo "::error::engine never became ready"; cat app.out; kill $PID || true; exit 1; }
          curl -fsS "$URL/bridge/health" | tee health.json
          grep -q '"name":"omniforge-bridge"' health.json
          # access control is live: unauthenticated calls are refused
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/bridge/info")" = "401"
          # the sandboxed deobfuscation path (webcrack + QuickJS-WASM) works inside THIS compiled macOS engine, not just on Linux
          node apps/desktop/scripts/smoke-engine.mjs "$APP/Contents/MacOS/omniforge-bridge" "$APP/Contents/Resources/tree-sitter"
          if grep -q "ui: UI could not reach the engine" "$LOG"; then echo "::error::the UI could not reach the engine"; cat "$LOG"; kill $PID || true; exit 1; fi
          kill $PID; sleep 2
          pgrep -f omniforge-bridge && { echo "::error::engine outlived the app"; exit 1; } || echo "engine stopped with the app"

      - name: Checksums
        shell: bash
        run: |
          mkdir -p dist-desktop
          cp "$DMG" "dist-desktop/OmniForge-RE_${{ matrix.label }}.dmg"
          (cd dist-desktop && shasum -a 256 *.dmg | tee "SHA256SUMS-${{ matrix.label }}.txt")
      - uses: actions/upload-artifact@v4
        with: { name: "omniforge-re-${{ matrix.label }}", path: dist-desktop/*, if-no-files-found: error, retention-days: 30 }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **macOS (Apple Silicon and Intel).** Builds are verified in CI (architecture, bundled engine, DMG contents, launch smoke test).
            Unless the release notes say it is signed and notarised, the app is **unsigned**: after copying it to Applications, right-click → Open once, or run
            `xattr -dr com.apple.quarantine "/Applications/OmniForge RE.app"`.
